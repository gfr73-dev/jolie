{% extends "base.html" %}
{% block title %}JOLIE | Login{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5 col-lg-4"><div class="card shadow-sm">
  <div class="card-body">
    <form method="post">
      <div class="mb-3"><label class="form-label">Email da DPD</label><input class="form-control" name="username" type="email" value="{{ username or '' }}" required autofocus></div>
      <div class="mb-3"><label class="form-label">Password</label><input class="form-control" name="password" type="password" required></div>
      <button class="btn btn-dark w-50 d-block mx-auto" type="submit">Entrar</button>
    </form>
  </div>
</div>
</div>
{% endblock %}
